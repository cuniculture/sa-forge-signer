[package]
name = "sa-forge-signer"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "A thin, self-hosted signer for agents playing SAGE C4 on Z.ink. Unofficial."
license = "Unlicense OR MIT"
repository = "https://github.com/ttdonovan/sa-forge-signer"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4"
solana-address = { version = "2.8.0", features = ["decode"] }
solana-hash = "4.7.0"
solana-instruction = "4.0.0"
solana-keypair = "4.0.0"
solana-message = { version = "5", features = ["wincode"] }
solana-signature = "3"
solana-signer = "4.0.0"
solana-transaction = { version = "5", features = ["wincode"] }
tiny_http = "0.12"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
wincode = "0.6"
zeroize = "1.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
